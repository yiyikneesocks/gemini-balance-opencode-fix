{% extends "base.html" %} {% block title %}模型冷却监控{% endblock %} {% block
content %}
<div class="container max-w-6xl mx-auto px-4">
  <div class="glass-card rounded-2xl shadow-xl p-6 md:p-8">
    <div class="absolute top-6 right-6 flex items-center gap-3">
      <button
        class="bg-white bg-opacity-20 hover:bg-opacity-30 rounded-full w-8 h-8 flex items-center justify-center text-primary-600 transition-all duration-300"
        onclick="refreshPage(this)"
        title="手动刷新"
      >
        <i class="fas fa-sync-alt"></i>
      </button>
    </div>

    <h1
      class="text-2xl md:text-3xl font-bold text-gray-800 mb-2 flex items-center justify-center"
    >
      <img
        src="/favicon.ico"
        alt="Gemini Balance Logo"
        class="h-9 inline-block align-middle mr-2"
      />
      模型冷却监控
    </h1>

    <!-- Navigation Tabs -->
    <div
      class="nav-buttons-container flex justify-center mb-8 overflow-x-auto gap-2"
    >
      <a
        href="/config"
        class="nav-link whitespace-nowrap flex items-center justify-center gap-2 px-6 py-3 font-medium rounded-lg text-gray-700 hover:text-gray-900 transition-all duration-200"
        style="background-color: rgba(229, 231, 235, 0.8)"
      >
        <i class="fas fa-cog"></i> 配置编辑
      </a>
      <a
        href="/keys"
        class="nav-link whitespace-nowrap flex items-center justify-center gap-2 px-6 py-3 font-medium rounded-lg text-gray-700 hover:text-gray-900 transition-all duration-200"
        style="background-color: rgba(229, 231, 235, 0.8)"
      >
        <i class="fas fa-tachometer-alt"></i> 监控面板
      </a>
      <a
        href="/model-cooldown"
        class="main-nav-btn whitespace-nowrap flex items-center justify-center gap-2 px-6 py-3 font-medium rounded-lg shadow-md hover:shadow-lg transition-all duration-200"
        style="background-color: #3b82f6 !important; color: #ffffff !important"
      >
        <i class="fas fa-snowflake"></i> 模型冷却
      </a>
      <a
        href="/logs"
        class="nav-link whitespace-nowrap flex items-center justify-center gap-2 px-6 py-3 font-medium rounded-lg text-gray-700 hover:text-gray-900 transition-all duration-200"
        style="background-color: rgba(229, 231, 235, 0.8)"
      >
        <i class="fas fa-exclamation-triangle"></i> 错误日志
      </a>
    </div>

    <p class="text-sm text-gray-500 text-center mb-6">
      展示<b>今日出现过 429/503</b> 的 (密钥, 模型) 冷却状态。RPD = 日配额耗尽
      （长冷却，重置前该 key 该模型不可用）；RPM = 瞬时限流（到期自动恢复）。
    </p>

    <div id="cooldown-container" class="space-y-4">
      <div class="text-center text-gray-400 py-8">
        <i class="fas fa-spinner fa-spin text-2xl"></i>
        <p class="mt-2">加载中...</p>
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block body_scripts %}
<script>
  function refreshPage(btn) {
    const icon = btn.querySelector("i");
    icon.classList.add("fa-spin");
    loadCooldown().finally(() => setTimeout(() => icon.classList.remove("fa-spin"), 500));
  }

  function formatRemaining(seconds) {
    if (seconds >= 3600) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      return `${h}小时${m}分`;
    }
    if (seconds >= 60) {
      return `${Math.floor(seconds / 60)}分${Math.floor(seconds % 60)}秒`;
    }
    return `${Math.round(seconds)}秒`;
  }

  function kindBadge(kind) {
    if (kind === "rpd") {
      return '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-700">RPD 日耗尽</span>';
    }
    return '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-700">RPM 限流</span>';
  }

  // 单 key 现状（与"最近错误类型"同样式，便于一眼区分）
  function keyStatus(k) {
    if (k.remaining_s > 0) {
      return k.kind === "rpd"
        ? { badge: '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-700">RPD日耗尽</span>' }
        : { badge: '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-orange-100 text-orange-700">冷却中</span>' };
    }
    return { badge: '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-700">可用</span>' };
  }

  // 模型总现状
  function statusBadge(status, label) {
    const map = {
      rpd_exhausted: "bg-red-100 text-red-700",
      all_cooling: "bg-orange-100 text-orange-700",
      degraded: "bg-yellow-100 text-yellow-700",
      available: "bg-green-100 text-green-700",
    };
    const cls = map[status] || "bg-gray-100 text-gray-600";
    return `<span class="px-2 py-0.5 rounded-full font-semibold ${cls}">${esc(label || status)}</span>`;
  }

  function toggleModel(model) {
    const body = document.getElementById("mc-body-" + model);
    const chev = document.getElementById("mc-chev-" + model);
    if (!body) return;
    const collapsed = body.style.display === "none";
    body.style.display = collapsed ? "" : "none";
    if (chev) {
      chev.className = `fas fa-chevron-${collapsed ? "down" : "right"} text-xs text-gray-400`;
    }
    localStorage.setItem("mc-collapsed-" + model, collapsed ? "0" : "1");
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function loadCooldown() {
    const container = document.getElementById("cooldown-container");
    try {
      const resp = await fetch("/api/keys/model-cooldown", {
        credentials: "same-origin",
        redirect: "error",
      });
      if (resp.status === 401 || resp.status === 307) {
        window.location.href = "/";
        return;
      }
      const text = await resp.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (parseErr) {
        window.location.href = "/";
        return;
      }
      if (!data.models || data.models.length === 0) {
        container.innerHTML = `
          <div class="text-center text-gray-400 py-10">
            <i class="fas fa-check-circle text-4xl text-green-400"></i>
            <p class="mt-3 text-gray-500">今日没有任何模型触发限流，一切正常</p>
          </div>`;
        return;
      }
      let html = "";
      for (const m of data.models) {
        const rows = (m.keys || [])
          .map((k) => {
            const now = keyStatus(k);
            return `
          <tr>
            <td class="px-3 py-2 font-mono text-xs">${esc(k.key)}</td>
            <td class="px-3 py-2">${now.badge}</td>
            <td class="px-3 py-2">${kindBadge(k.kind)}</td>
            <td class="px-3 py-2 text-right font-mono text-sm">${
              k.remaining_s > 0 ? formatRemaining(k.remaining_s) : '<span class="text-green-600">已恢复</span>'
            }</td>
            <td class="px-3 py-2 text-right text-xs text-gray-400">${esc(k.last_error_time || "")}</td>
          </tr>`;
          })
          .join("");
        const modelStatus = statusBadge(m.status, m.status_label);
        const collapsed = localStorage.getItem("mc-collapsed-" + m.model) === "1";
        html += `
        <div class="glass-card rounded-xl shadow p-4">
          <div class="flex items-center justify-between flex-wrap gap-2 ${
            collapsed ? "" : "mb-3"
          }">
            <div class="font-semibold text-gray-800 flex items-center gap-2 cursor-pointer select-none"
                 onclick="toggleModel('${esc(m.model)}')">
              <i class="fas fa-chevron-${collapsed ? "right" : "down"} text-xs text-gray-400" id="mc-chev-${esc(m.model)}"></i>
              <i class="fas fa-cube text-primary-500"></i>${esc(m.model)}
            </div>
            <div class="flex items-center gap-2 text-xs">
              ${modelStatus}
              <span class="px-2 py-0.5 rounded-full bg-red-100 text-red-700">RPD: ${m.rpd_keys}</span>
              <span class="px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-700">RPM: ${m.rpm_keys}</span>
              <span class="px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">出错key数: ${m.error_keys}</span>
              ${
                m.cooling_keys > 0
                  ? `<span class="text-gray-500">最早恢复: ${formatRemaining(m.earliest_release_s)}</span>`
                  : ""
              }
            </div>
          </div>
          <div class="overflow-x-auto" id="mc-body-${esc(m.model)}" style="${
            collapsed ? "display:none" : ""
          }">
            <table class="min-w-full text-sm text-gray-700">
              <thead>
                <tr class="text-left text-xs text-gray-400 border-b">
                  <th class="px-3 py-1.5">密钥</th>
                  <th class="px-3 py-1.5">现状</th>
                  <th class="px-3 py-1.5">最近错误类型</th>
                  <th class="px-3 py-1.5 text-right">剩余冷却</th>
                  <th class="px-3 py-1.5 text-right">最近错误时间</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
      }
      container.innerHTML = html;
    } catch (e) {
      container.innerHTML = `
        <div class="text-center text-red-400 py-10">
          <i class="fas fa-exclamation-circle text-4xl"></i>
          <p class="mt-3">加载失败: ${esc(e.message)}</p>
        </div>`;
    }
  }

  document.addEventListener("DOMContentLoaded", loadCooldown);
  setInterval(loadCooldown, 30000);
</script>
{% endblock %}
